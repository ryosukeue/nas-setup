[global]
    server min protocol = SMB2_10
    server max protocol = SMB3
    map to guest = Never
    server string = Photo NAS

[Photos]
    comment = PC Photos for Immich
    path = /srv/photos/pc
    browseable = yes
    read only = no
    guest ok = no
    valid users = nasowner
    force group = photos
    create mask = 0660
    directory mask = 2770
    inherit permissions = yes
    vfs objects = acl_xattr
    map acl inherit = yes
    store dos attributes = yes
